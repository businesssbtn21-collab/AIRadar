# クラウドのルーティンが claude/feed-auto に置いたフィードの候補を、点検してから main に反映する。
#
# ルーティンは main に直接書かない。ここで「変わったのがフィードの2ファイルだけか」
# 「アプリが読める形か」「追加の件数が上限内か」を確かめ、通ったものだけを早送りで main に載せる。
# 定期実行は常に main 側のこのファイルで動くので、候補ブランチから点検を書き換えることはできない。
name: Publish feed

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find candidate
        id: candidate
        run: |
          if ! git fetch --quiet origin claude/feed-auto; then
            echo "候補ブランチなし"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          candidate=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$candidate" HEAD; then
            echo "反映済み"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor HEAD "$candidate"; then
            echo "::error::claude/feed-auto が最新の main から作られていない(早送りできない)"
            exit 1
          fi
          for f in $(git diff --name-only HEAD "$candidate"); do
            case "$f" in
              feed-v2.json|feed.json) ;;
              *) echo "::error::フィード以外のファイルが変わっている: $f"; exit 1 ;;
            esac
          done
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"

      - name: Validate
        if: steps.candidate.outputs.skip != 'true'
        run: |
          # フィード以外は main と同じなので、点検スクリプトは main のものが動く
          git checkout --quiet --detach "${{ steps.candidate.outputs.sha }}"
          python3 tools/validate_feed.py --base "${{ steps.candidate.outputs.base }}"
          python3 tools/build_legacy_feed.py
          git diff --exit-code feed.json

      - name: Publish to main
        if: steps.candidate.outputs.skip != 'true'
        run: git push origin "${{ steps.candidate.outputs.sha }}:refs/heads/main"
