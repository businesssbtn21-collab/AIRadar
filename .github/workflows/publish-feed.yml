# クラウドのルーティンが claude/feed-* に置いたフィードの候補を、点検してから main に反映する。
#
# ルーティンは main に直接書かない。ここで「変わったのがフィードの2ファイルだけか」
# 「アプリが読める形か」「追加の件数が上限内か」を確かめ、通ったものだけを早送りで main に載せる。
# 候補は毎回別の名前(claude/feed-日付)で置かれる。反映済みの候補と、main から外れてもう反映できない候補はここで消す。
# 候補が置かれた時点で動く。定期実行は取りこぼしたときの予備(GitHub の定期実行は飛ばされることがある)。
name: Publish feed

on:
  push:
    branches: ["claude/feed-*"]
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find candidate
        id: candidate
        run: |
          git fetch --quiet origin '+refs/heads/claude/feed-*:refs/remotes/origin/claude/feed-*'
          candidate=""
          # 新しい順に見て、main から早送りできる最初のものを候補にする
          for ref in $(git for-each-ref --sort=-committerdate --format='%(refname:short)' 'refs/remotes/origin/claude/feed-*'); do
            sha=$(git rev-parse "$ref")
            if git merge-base --is-ancestor "$sha" HEAD; then continue; fi
            if git merge-base --is-ancestor HEAD "$sha"; then candidate="$sha"; echo "候補: $ref ($sha)"; break; fi
          done
          if [ -z "$candidate" ]; then
            echo "反映する候補なし"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in $(git diff --name-only HEAD "$candidate"); do
            case "$f" in
              feed-v2.json|feed.json) ;;
              *) echo "::error::フィード以外のファイルが変わっている: $f"; exit 1 ;;
            esac
          done
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"

      - name: Validate
        if: steps.candidate.outputs.skip != 'true'
        run: |
          # フィード以外は main と同じなので、点検スクリプトは main のものが動く
          git checkout --quiet --detach "${{ steps.candidate.outputs.sha }}"
          python3 tools/validate_feed.py --base "${{ steps.candidate.outputs.base }}"
          python3 tools/build_legacy_feed.py
          git diff --exit-code feed.json

      - name: Publish to main
        if: steps.candidate.outputs.skip != 'true'
        run: git push origin "${{ steps.candidate.outputs.sha }}:refs/heads/main"

      - name: Clean up candidates
        if: always()
        run: |
          git fetch --quiet origin main
          main=$(git rev-parse origin/main)
          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/claude/feed-*'); do
            sha=$(git rev-parse "$ref")
            # 反映済み、または main から外れて二度と早送りできないものだけ消す(反映待ちは残す)
            if git merge-base --is-ancestor "$sha" "$main" || ! git merge-base --is-ancestor "$main" "$sha"; then
              git push --quiet origin --delete "${ref#origin/}" || true
              echo "片付け: ${ref#origin/}"
            fi
          done
